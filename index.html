<script>
let N=7;const D=[[0,1],[0,-1],[1,0],[-1,0]],$=s=>document.querySelector(s),rand=a=>a[Math.random()*a.length|0],FACE='<u></u><u></u><s></s>';

async function syncName(){const h=await getDb();if(!h)return;try{const id=await h.u.id();for(const c of['scores','daily']){const r=h.db.doc(c+'/'+id),s=await r.get();if(s.exists)await r.set({...s.data(),name:pname})}}catch(e){}}
function askName(cb){show(`<h2>✏️ なまえ</h2><p>ランキングに出る名前（10文字まで）</p><input id="ni" maxlength="10" value="${esc(pname)}" placeholder="なまえ" style="font:inherit;font-size:20px;font-weight:800;text-align:center;border:3px solid var(--me);border-radius:16px;padding:10px;width:80%;box-sizing:border-box;background:#fff;color:#35221a"><br><button class="go" id="ns" style="margin-top:16px;font-size:18px;padding:12px 36px">きめた！</button>`,true,true);const i=$('#ni');setTimeout(()=>i.focus(),60);const done=()=>{const v=i.value.trim().slice(0,10);if(!v){i.style.borderColor='#e0322a';return}pname=v;try{localStorage.setItem('pit_name',pname)}catch(e){}syncName();cb()};$('#ns').onclick=done;i.onkeydown=e=>{if(e.key==='Enter')done()}}

const T=["スルー！","惜しい！","あぁ…","止まれ！"],F=["次こそ…！","読みは惜しかった","もう1回で絶対いける","あと一手だった？"];
$('#bg').innerHTML=Array.from({length:14},()=>{const s=14+Math.random()*50;return`<span style="left:${Math.random()*100}%;width:${s}px;height:${s}px;animation-duration:${9+Math.random()*10}s;animation-delay:-${Math.random()*14}s"></span>`}).join('');
let AC;function snd(f,d=.1,ty='sine',v=.1,to,at=0){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+at,o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}

function gen(){N=stage>=10?8:7;const o=Math.random;if(daily)Math.random=mul(today()*100+stage);try{gen0()}finally{Math.random=o}}
function gen0(){const nw=Math.min(8+stage+(N>7?4:0),24);let lo=Math.min(3+(stage>>1),9);

if(c.length){G=+rand(c);const bonus=stage%5===0;mean=!bonus&&stage>=4&&stage%4===0;fled=0;G0=G;slk=(stage<4?2:stage<12?1:0)+(bonus||mean?1:0);opt=dist[G];L=opt+slk;K=new Set();const free=e.filter(i=>i!==S&&i!==G),nc=bonus?9:stage>=2?Math.min(2+(stage>>1),5):0;while(K.size<nc&&K.size<free.length)K.add(rand(free));return}}}

const pe=()=>$('#p');

function pips(){$('#pips').innerHTML=Array.from({length:L},(_,i)=>`<i class="${i<left?'':'off'}"></i>`).join('')}
function hud(){$('#stg').textContent=stage;$('#hearts').textContent=lives>0?'❤'.repeat(lives):'—';$('#mx').textContent=combo>1?' 🔥×'+mult():'';const e=$('#sc'),a=shown,b=score;shown=b;if(a===b){e.textContent=b.toLocaleString();return}const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/600);e.textContent=Math.round(a+(b-a)*k).toLocaleString();if(k<1)requestAnimationFrame(f)})(t0)}
function toast(t,c){const e=$('#toast');e.textContent=t;e.className='on '+c;clearTimeout(tt);tt=setTimeout(()=>e.className='',1100)}
function shake(){const b=$('#bd');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}
function flash(c,k){const e=cells[c];if(!e)return;e.classList.remove(k);void e.offsetWidth;e.classList.add(k);setTimeout(()=>e.classList.remove(k),800)}
function mood(m,ms){const p=pe();if(!p)return;p.className=m;if(ms)setTimeout(()=>{if(pe()===p)p.className=''},ms)}
function look(d){pe().style.setProperty('--ex',D[d][0]);pe().style.setProperty('--ey',D[d][1])}
function at(e,c){e.style.left=(c%N+.5)*100/N+'%';e.style.top=((c/N|0)+.5)*100/N+'%'}
function add(e,ms){$('#grid').appendChild(e);setTimeout(()=>e.remove(),ms)}
function ring(c,col){const e=document.createElement('b');e.className='ring';e.style.borderColor=col;at(e,c);add(e,700)}
function pop(c,t,col){const e=document.createElement('div');e.className='pp';e.textContent=t;if(col)e.style.color=col;at(e,c);add(e,950)}
function burst(c,n,sp,hs){for(let i=0;i<n;i++){const s=document.createElement('span');s.className='cf';at(s,c);s.style.marginLeft=s.style.marginTop='-4px';s.style.background=`hsl(${hs??Math.random()*360} 95% 62%)`;s.style.setProperty('--dx',(Math.random()*2-1)*sp+'px');s.style.setProperty('--dy',(Math.random()*2-1.2)*sp+'px');add(s,1000)}}
function banner(t,c){const b=$('#bn');b.textContent=t;b.style.setProperty('--bc',c);b.classList.remove('show');void b.offsetWidth;b.classList.add('show')}
function scr(){const f=$('#fl');f.classList.remove('on');void f.offsetWidth;f.classList.add('on')}
function reset(){const p=pe();p.style.setProperty('--t','0ms');if(G!==G0){cells[G].classList.remove('g','m','f');G=G0;cells[G].classList.add('g');if(mean)cells[G].classList.add('m')}fled=0;hist2=[];P=S;left=L;place();void p.offsetWidth;busy=false;pips();hud();mood('')}
function level(){gen();build();reset();theme();if(lastN&&N>lastN)setTimeout(()=>toast('🗺 マップが広がった！','ok'),1200);lastN=N;retried=false;$('#re').classList.remove('used');const b=stage%5===0;banner(b?'BONUS STAGE ⭐':mean?'😈 いじわるSTAGE':'STAGE '+stage,b?'#ff9a3c':mean?'#e0322a':'#3a7bff');const m=mean?'★を通り過ぎると逃げるぞ！':{2:'🪙 コイン登場！通ると+50',3:'ネバネバ登場！触れると止まる'}[stage];if(m)setTimeout(()=>toast(m,'ok'),900)}
function flee(){const dist={[P]:0},q=[P];while(q.length){const c=q.shift();for(let d=0;d<4;d++){const r=slide(c%N,c/N|0,d);if(r.length){const k=r[r.length-1];if(dist[k]===undefined){dist[k]=dist[c]+1;q.push(k)}}}}
let c=Object.keys(dist).filter(k=>dist[k]>=Math.max(1,left-1)&&dist[k]<=left&&+k!==G);if(!c.length)c=Object.keys(dist).filter(k=>dist[k]>=1&&dist[k]<=left&&+k!==G);if(!c.length)return;
const o=G;G=+rand(c);fled++;cells[o].classList.remove('g','m','f');const b=cells[G];b.classList.add('g','m','f');ring(o,'#ff3d6b');ring(G,'#2fd88a');pop(o,'べーっ！😜');say('べーっ！');snd(600,.3,'sawtooth',.08,1300);vib([15,30,15]);setTimeout(()=>b.classList.remove('f'),900)}
function move(d){if(busy||!playing)return;const p=slide(P%N,P/N|0,d);
if(!p.length){snd(110,.08,'square',.07);vib(8);return}
busy=true;left--;pips();look(d);const n=p.length,dur=60*n+100,e=pe();e.style.setProperty('--t',dur+'ms');P=p[n-1];place();
snd(520,dur/1000,'triangle',.08,180);
p.forEach((c,i)=>setTimeout(()=>{flash(c,'tr');if(K.has(c)){K.delete(c);const k=cells[c].querySelector('.k');if(k)k.remove();const v=Math.round(50*mult());score+=v;hud();pop(c,'+'+v,'#e09b00');burst(c,8,50,48);snd(880+i*60,.12,'square',.07);vib(10)}},i*60+30));
const gi=p.indexOf(G),pass=gi>=0&&gi<n-1;
if(pass)setTimeout(()=>{flash(G,'miss');ring(G,'#ff3d6b');pop(G,rand(T));mood('oo',700);say(rand(['あー！','おしい！','止まれー！']));snd(200,.3,'sawtooth',.09,80);vib(30)},gi*60+80);
setTimeout(()=>{const i=e.firstChild;i.classList.remove('sq');void i.offsetWidth;i.classList.add('sq');
if(P===G)return win();
ring(P,'#fff');burst(P,6,40,45);snd(240,.07,'square',.06);vib(12);
if(pass){near++;hud();toast(rand(F),'bad');shake();if(mean&&left>0)flee()}
if(left<=0)lose();else busy=false},dur+20)}
function win(){combo++;maxCombo=Math.max(maxCombo,combo);const perfect=left===slk&&!fled,gain=Math.round((100*stage+left*60+(combo-1)*40+(perfect?200:0)+(mean?150:0))*mult());score+=gain;pop(G,'+'+gain,'#12b36a');mood('hp');say(perfect?'パーフェクト！すごーい！':combo>=3?combo+'連続！すごーい！':rand(['すごーい！','やったー！','ナイス！','ぴたっ！']));burst(G,34,130);ring(G,'#2fd88a');scr();[523,659,784,1047].forEach((f,i)=>snd(f,.22,'triangle',.1,0,i*.08));vib([20,30,40]);
const cl=stage;banner(perfect?'PERFECT! 💎':combo>1?`CLEAR! 🔥${combo}`:'CLEAR!',perfect?'#ff9a3c':'#12b36a');stage++;
if(stage>best){best=stage;try{localStorage.setItem('pit_best',best)}catch(e){}}hud();setTimeout(level,1100)}
function lose(){combo=0;lives--;hud();mood('sd');say(rand(['あーあ…','ざんねん！']));shake();snd(160,.5,'sawtooth',.12,50);vib([60,40,60]);
if(lives<=0){setTimeout(over,800)}else{toast(rand(F),'bad');setTimeout(reset,1000)}}
function show(h,home,card){$('#box').innerHTML=h;$('#box').className='box'+(home&&!card?' hm':'');$('#ov').className=home?'home':'';document.body.classList.toggle('home',!!home)}
async function submit(){if(score<=0)return;const h=await getDb();if(!h)return;try{const id=await h.u.id(),r=h.db.doc((daily?'daily/':'scores/')+id),s=await r.get();if(!s.exists||(daily&&s.data().date!==today())||s.data().score<score)await r.set({score,stage,near,combo:maxCombo,date:today(),name:pname,t:Date.now()});else if(s.data().name!==pname)await r.set({...s.data(),name:pname});const a0=await h.db.collection(daily?'daily':'scores').orderBy('score','desc').limit(100).get(),all=daily?a0.docs.filter(d=>d.data().date===today()):a0.docs,i=all.findIndex(d=>d.id===id),e=$('#gr');if(e&&i>=0)e.textContent=`みんなの中で ${i+1}位 ／ ${all.length}人`}catch(e){}}
function over(){playing=false;const rec=score>bestScore&&score>0,rk=rankOf(stage);lastD=Date.now();if(rec)bestScore=score;hist.push({s:score,st:stage,d:lastD});hist.sort((a,b)=>b.s-a.s);hist=hist.slice(0,10);const lr=hist.findIndex(h=>h.d===lastD)+1;try{localStorage.setItem('pit_score',bestScore);localStorage.setItem('pit_hist',JSON.stringify(hist))}catch(e){}
show(`<h2>${daily?'📅 DAILY ':''}GAME OVER</h2><div class="emo">${rk[1]}</div><div class="rk">${rk[2]}</div><div class="sc" id="fs">0</div>${rec?'<div class="nr">🎉 NEW RECORD!</div>':''}<div class="stats"><div><b>${stage}</b><small>STAGE</small></div><div><b>${near}</b><small>惜しい</small></div><div><b>${maxCombo}</b><small>最大コンボ</small></div></div><p id="gr">${lr?`自分の記録の中で ${lr}位`:'&nbsp;'}</p><button class="go" id="go">もう一回！</button><div class="sub2"><button id="bl">🏆 ランキング</button><button id="sh">📤 シェア</button><button id="gh">🏠</button></div>`);
countUp($('#fs'),score);if(rec)say('新記録！すごーい！');if(rec)[523,659,784,1047,1319].forEach((f,i)=>snd(f,.25,'triangle',.1,0,i*.09));
$('#go').onclick=()=>start(daily);$('#gh').onclick=home;$('#bl').onclick=()=>board('local');$('#sh').onclick=async()=>{const t=`「ピタッと止まれ！」で ${score.toLocaleString()}点（STAGE ${stage}・${rk[2]}）出した！`;try{if(navigator.share)await navigator.share({text:t});else{await navigator.clipboard.writeText(t);$('#sh').textContent='✅ コピー'}}catch(e){}};submit()}
const row=(i,n,s,sub,me)=>`<div class="row${me?' me':''}"><b>${['🥇','🥈','🥉'][i]||i+1}</b><span>${esc(n)}</span><em>${s.toLocaleString()}</em><small>${esc(sub)}</small></div>`;
async function board(t){tab=t||tab;show(`<h2>🏆 ランキング</h2><div class="tabs"><button class="tb${tab==='local'?' on':''}" id="t1">自分の記録</button><button class="tb${tab==='all'?' on':''}" id="t2">みんな</button><button class="tb${tab==='daily'?' on':''}" id="t3">📅 今日</button></div><div class="rows" id="rows"><div class="empty">読み込み中…</div></div><button id="bk" style="margin-top:14px">← もどる</button>`,true,true);
$('#t1').onclick=()=>board('local');$('#t2').onclick=()=>board('all');$('#t3').onclick=()=>board('daily');$('#bk').onclick=home;const R=$('#rows'),my=tab;
if(my==='local'){R.innerHTML=hist.length?hist.map((h,i)=>row(i,new Date(h.d).toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'}),h.s,'STAGE '+h.st,h.d===lastD)).join(''):'<div class="empty">まだ記録がありません。<br>まずは1回あそんでみよう！</div>';return}
const h=await getDb();if(tab!==my)return;if(!h){R.innerHTML='<div class="empty">このページを共有された人どうしで<br>競えるランキングです。<br>ここでは今は使えません。</div>';return}
try{const sn=await h.db.collection(my==='daily'?'daily':'scores').orderBy('score','desc').limit(my==='daily'?100:20).get(),dl=my==='daily'?sn.docs.filter(d=>d.data().date===today()).slice(0,20):sn.docs,snap={docs:dl,empty:!dl.length},me=await h.u.id(),ps=await h.u.profiles(dl.map(d=>d.id));if(tab!==my)return;R.innerHTML=snap.empty?'<div class="empty">まだだれも記録していません。<br>一番乗りのチャンス！</div>':snap.docs.map((d,i)=>row(i,d.data().name||(ps[d.id]&&ps[d.id].name)||'だれか',d.data().score,'STAGE '+d.data().stage,d.id===me)).join('')}catch(e){if(tab===my)R.innerHTML='<div class="empty">読み込めませんでした。</div>'}}
function start(dm){if(!pname){askName(()=>start(dm));return}daily=dm===true;lastN=0;lastW=-1;coins=0;undos=1;stage=1;lives=3;near=0;combo=0;maxCombo=0;score=0;shown=0;playing=true;$('#ov').className='hide';document.body.classList.remove('home');[392,523,659].forEach((f,i)=>snd(f,.15,'triangle',.1,0,i*.07));level()}
function home(){playing=false;busy=true;show(`<div class="logo a">${[...'ピタッと'].map((c,i)=>`<span style="animation-delay:${i*.12}s">${c}</span>`).join('')}</div><div class="logo b">${[...'止まれ！'].map((c,i)=>`<span style="animation-delay:${.5+i*.12}s">${c}</span>`).join('')}</div><div class="tag">ぜったい止まれない？新感覚スライドパズル</div><div class="track"><span class="st">★</span><div class="mas"><i class="fc">${FACE}</i></div></div><button class="go" id="go">スタート</button><br><button id="dy" style="margin-top:12px">📅 今日のチャレンジ（みんな同じ盤面）</button><div class="chips"><span class="chip">👆 スワイプで滑る</span><span class="chip">★ でピタッ</span><span class="chip">● 手数に注意</span><span class="chip">🪙 コインで高得点</span><span class="chip">😈 ゴールが逃げる!?</span></div>${bestScore>0?`<div class="best">🏆 BEST ${bestScore.toLocaleString()} ／ STAGE ${best}</div>`:''}<br><button id="hl" style="margin-top:12px">🏆 ランキング</button> <button id="nm2" style="margin-top:12px">✏️ ${pname?esc(pname):'なまえ'}</button>`,true);$('#go').onclick=start;$('#hl').onclick=()=>board('local');$('#dy').onclick=()=>start(true);$('#nm2').onclick=()=>askName(home)}
let sx=null,sy;addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx,dy=e.clientY-sy;sx=null;if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;Math.abs(dx)>Math.abs(dy)?move(dx>0?2:3):move(dy>0?0:1)});
addEventListener('keydown',e=>{const k={ArrowDown:0,ArrowUp:1,ArrowRight:2,ArrowLeft:3}[e.key];if(k!==undefined){e.preventDefault();move(k)}});
$('#re').onclick=()=>{if(!playing||busy)return;if(retried){toast('やり直しは1ステージに1回だけ！','bad');return}retried=true;$('#re').classList.add('used');reset()};
$('#hm').onclick=home;
$('#mu').onclick=()=>{mute=!mute;$('#mu').textContent=mute?'🔇':'🔊'};
gen();build();reset();busy=true;home();
